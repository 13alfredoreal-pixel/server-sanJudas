name: Bug
description: Comportamiento incorrecto o error (API)
title: "[BSJT-???] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Nomenclatura:** título `[BSJT-XXX] Descripción del bug`. Ver docs/GITHUB-WORKFLOW.md.
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción del bug
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
